# fly.toml app configuration file generated for relvia on 2026-06-25T21:36:56+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'relvia'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADVISOR = 'anthropic'
  ADVISOR_GLOBAL_BUDGET_USD = '20'
  ADVISOR_MODEL = 'claude-haiku-4-5'        # fallback/decide base
  # model-split: tani Haiku decyduje (reżyser), mocniejszy Sonnet pisze dymki.
  # (gpt-5-chat-latest miał lepszy język/koszt, ale gorszą trafność psychologiczną
  #  i „ludzki ton" w evalu — integracja OpenAI parkuje na branchu feat/openai-generate).
  ADVISOR_DECIDE_MODEL = 'claude-haiku-4-5'
  ADVISOR_GENERATE_MODEL = 'claude-sonnet-4-6'
  # cache 1h: ludzie odpowiadają wolno; 5-min cache wygasał → drogie re-zapisy
  ADVISOR_CACHE_TTL = '1h'
  NODE_ENV = 'production'

[[mounts]]
  source = 'relvia_data'
  destination = '/data'

[http_service]
  internal_port = 4004
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
